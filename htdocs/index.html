<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>Kuula Web Radio Player</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section
        id="display"
        class="display"
        role="button"
        tabindex="0"
        aria-label="Toggle play and pause"
      >
        <div id="indicators" class="channel-indicators" aria-hidden="true"></div>
        <div class="info-bar">
          <span id="region" class="region"></span>
          <span id="bitrate" class="bitrate"></span>
        </div>
        <div id="channel-name" class="channel-name">— — —</div>
        <div id="status" class="status">◼ PAUSED</div>
        <div
          id="vu"
          class="vu"
          data-mode="off"
          role="button"
          tabindex="0"
          aria-label="Cycle VU meter mode"
          title="VU meter (click to cycle)"
        >
          <div class="vu-led" hidden aria-hidden="true">
            <div class="vu-row">
              <span class="vu-ch">L</span>
              <div class="vu-bar" id="vu-bar-l"></div>
            </div>
            <div class="vu-row">
              <span class="vu-ch">R</span>
              <div class="vu-bar" id="vu-bar-r"></div>
            </div>
          </div>
          <canvas id="vu-canvas" class="vu-canvas" hidden aria-hidden="true"></canvas>
        </div>
      </section>

      <nav class="controls" aria-label="Channel controls">
        <button id="prev" class="arrow" type="button" aria-label="Previous channel">
          <span aria-hidden="true">◀</span>
        </button>
        <button id="next" class="arrow" type="button" aria-label="Next channel">
          <span aria-hidden="true">▶</span>
        </button>
      </nav>
    </main>

    <audio id="audio" preload="none"></audio>
    <audio id="audio-plain" preload="none"></audio>

    <a
      class="github-link"
      href="https://github.com/okko/kuula"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="View source on GitHub"
      title="View source on GitHub"
    >
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
        />
      </svg>
    </a>

    <script src="app.js"></script>
  </body>
</html>
